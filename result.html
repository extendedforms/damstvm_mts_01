<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#071a32" />
  <title>Result - DAMS Trivandrum Mock Test Series</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body.result-page {
      min-height: 100vh;
      min-height: 100svh;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      overflow-y: auto;
      background: #f3f5f9;
      color: #26364f;
      font-family: Arial, Helvetica, sans-serif;
    }

    .result-container {
      width: min(100%, 1050px);
      margin: 0 auto;
      padding: 18px 22px 14px;
      border: 1px solid #e1e6ee;
      border-radius: 18px;
      background: rgba(255,255,255,.98);
      box-shadow: 0 12px 36px rgba(20,39,66,.10);
    }

    .institution-heading {
      margin: 0 0 5px;
      color: #174a7c;
      text-align: center;
      text-transform: uppercase;
      font-size: clamp(17px, 2.4vw, 24px);
      line-height: 1.15;
      letter-spacing: .055em;
      font-weight: 900;
    }

    .result-heading {
      margin: 0 0 13px;
      color: #0a2342;
      text-align: center;
      font-size: clamp(25px, 3.4vw, 34px);
      line-height: 1.1;
      font-weight: 900;
    }

    .candidate-card {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px 16px;
      margin: 0 0 12px;
      padding: 12px 15px;
      border: 1px solid #e1e6ee;
      border-radius: 13px;
      background: #fff;
    }

    .candidate-line {
      min-width: 0;
      font-size: 14px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .candidate-line strong {
      color: #34445e;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 9px;
      margin: 0 0 12px;
    }

    .stat-card {
      min-width: 0;
      min-height: 78px;
      padding: 10px 14px;
      border: 1px solid #e1e6ee;
      border-radius: 13px;
      background: #fff;
    }

    .stat-label {
      margin-bottom: 3px;
      color: #58677d;
      font-size: 13px;
      font-weight: 800;
    }

    .stat-value {
      color: #26364f;
      font-size: clamp(23px, 3vw, 30px);
      line-height: 1.05;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .result-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 2px;
    }

    .result-btn {
      min-width: 145px;
      min-height: 42px;
      padding: 9px 18px;
      border: 0;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .result-btn.primary {
      background: #174a7c;
      color: #fff;
    }

    /* Laptop screens */

    @media (min-width: 761px) and (max-height: 850px) {
      body.result-page {
        padding: 8px;
      }

      .result-container {
        padding: 13px 18px 9px;
      }

      .result-heading {
        margin-bottom: 9px;
      }

      .candidate-card {
        padding: 9px 13px;
        margin-bottom: 9px;
      }

      .stats-grid {
        gap: 7px;
        margin-bottom: 9px;
      }

      .stat-card {
        min-height: 68px;
        padding: 8px 12px;
      }

      .result-btn {
        min-height: 38px;
      }
    }

    /* Mobile responsive layout */

    @media (max-width: 760px) {
      body.result-page {
        padding: 8px;
        align-items: center;
      }

      .result-container {
        padding: 13px 12px 9px;
        border-radius: 14px;
      }

      .institution-heading {
        font-size: clamp(15px, 4.2vw, 20px);
        letter-spacing: .035em;
      }

      .result-heading {
        margin-bottom: 9px;
        font-size: 27px;
      }

      .candidate-card {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 7px 10px;
        padding: 9px 10px;
        margin-bottom: 9px;
      }

      .candidate-line {
        font-size: 12px;
      }

      .stats-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 7px;
        margin-bottom: 9px;
      }

      .stat-card {
        min-height: 62px;
        padding: 7px 10px;
        border-radius: 10px;
      }

      .stat-label {
        font-size: 11px;
      }

      .stat-value {
        font-size: 23px;
      }

      .result-actions {
        gap: 8px;
      }

      .result-btn {
        min-width: 0;
        min-height: 38px;
        padding: 8px 10px;
        font-size: 13px;
      }
    }

    @media (max-width: 360px) {
      .candidate-line {
        font-size: 11px;
      }

      .stat-card {
        min-height: 58px;
      }

      .stat-value {
        font-size: 21px;
      }
    }
  </style>
</head>

<body class="result-page">

  <main class="result-container">

    <h2 class="institution-heading">
      DAMS TRIVANDRUM MOCK TEST SERIES
    </h2>

    <h1 class="result-heading">
      Result
    </h1>

    <!-- Candidate Details -->

    <section class="candidate-card" aria-label="Candidate details">

      <div class="candidate-line">
        <strong>Name:</strong>
        <span id="candName">-</span>
      </div>

      <div class="candidate-line">
        <strong>Candidate ID:</strong>
        <span id="candId">-</span>
      </div>

      <div class="candidate-line">
        <strong>Email:</strong>
        <span id="candEmail">-</span>
      </div>

      <div class="candidate-line">
        <strong>Phone:</strong>
        <span id="candPhone">-</span>
      </div>

    </section>

    <!-- Examination Results -->

    <section class="stats-grid" aria-label="Examination result">

      <div class="stat-card">
        <div class="stat-label">Score</div>
        <div class="stat-value" id="score">-</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">Correct</div>
        <div class="stat-value" id="correct">-</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">Wrong</div>
        <div class="stat-value" id="wrong">-</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">Unattempted</div>
        <div class="stat-value" id="unattempted">-</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">Time Taken</div>
        <div class="stat-value" id="timeTaken">-</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">Violations</div>
        <div class="stat-value" id="violations">-</div>
      </div>

    </section>

    <!-- Logout Only -->

    <div class="result-actions">

      <button
        class="result-btn primary"
        type="button"
        onclick="backToLogin()"
      >
        Logout
      </button>

    </div>

  </main>

  <script src="config.js?v=20261110a"></script>

  <script>
    function safeParse(value) {
      try {
        return JSON.parse(value);
      } catch (e) {
        return null;
      }
    }

    function firstDefined() {
      for (let i = 0; i < arguments.length; i++) {
        const value = arguments[i];

        if (
          value !== undefined &&
          value !== null &&
          value !== ""
        ) {
          return value;
        }
      }

      return null;
    }

    function byPath(obj, path) {
      if (!obj || !path) return undefined;

      return path.split(".").reduce(function(acc, key) {
        return acc && acc[key] !== undefined
          ? acc[key]
          : undefined;
      }, obj);
    }

    function setText(id, value, fallback) {
      const el = document.getElementById(id);

      if (el) {
        el.textContent =
          value !== undefined &&
          value !== null &&
          value !== ""
            ? value
            : fallback;
      }
    }

    function formatTime(seconds) {
      const sec = Number(seconds);

      if (!Number.isFinite(sec) || sec < 0) {
        return "-";
      }

      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;

      if (h > 0) {
        return h + " hr " + m + " min " + s + " sec";
      }

      if (m > 0) {
        return m + " min " + s + " sec";
      }

      return s + " sec";
    }

    // Candidate session is isolated to this browser tab.
    // Result/submission keys are isolated by candidate + exam window.

    function candidateWindowStorageKey(prefix, candidateId) {
      const cid = encodeURIComponent(
        String(candidateId || "").trim()
      );

      const startMs = Number.isFinite(window.EXAM_START_MS)
        ? window.EXAM_START_MS
        : 0;

      const endMs = Number.isFinite(window.EXAM_END_MS)
        ? window.EXAM_END_MS
        : 0;

      return prefix + "_" + cid + "_" + startMs + "_" + endMs;
    }

    const candidate = safeParse(
      sessionStorage.getItem("neet_candidate") || ""
    ) || {};

    const candidateId = String(
      candidate.candidateId || candidate.id || ""
    ).trim();

    const resultKey = candidateWindowStorageKey(
      "neet_result",
      candidateId
    );

    const submittedKey = candidateWindowStorageKey(
      "neet_submitted",
      candidateId
    );

    let result = safeParse(
      localStorage.getItem(resultKey) || ""
    ) || {};

    // Never display a result whose embedded candidate ID differs.

    if (
      result.candidateId &&
      String(result.candidateId).trim() !== candidateId
    ) {
      result = {};
    }

    // Candidate information.

    if (!candidateId || !candidate.token) {

      window.location.replace(
        "login.html?v=" + Date.now()
      );

    } else {

      setText(
        "candName",
        candidate.name,
        "-"
      );

      setText(
        "candId",
        candidateId,
        "-"
      );

      setText(
        "candEmail",
        candidate.email,
        "-"
      );

      setText(
        "candPhone",
        candidate.phone,
        "-"
      );

    }

    // Score.

    const score = firstDefined(
      result.score,
      result.marks,
      result.totalScore,
      byPath(result, "data.score"),
      byPath(result, "data.marks"),
      byPath(result, "result.score"),
      byPath(result, "summary.score")
    );

    // Correct answers.

    const correct = firstDefined(
      result.correct,
      result.correctCount,
      byPath(result, "data.correct"),
      byPath(result, "data.correctCount"),
      byPath(result, "result.correct"),
      byPath(result, "summary.correct")
    );

    // Wrong answers.

    const wrong = firstDefined(
      result.wrong,
      result.wrongCount,
      byPath(result, "data.wrong"),
      byPath(result, "data.wrongCount"),
      byPath(result, "result.wrong"),
      byPath(result, "summary.wrong")
    );

    // Unattempted questions.

    const unattempted = firstDefined(
      result.unattempted,
      result.unanswered,
      byPath(result, "data.unattempted"),
      byPath(result, "data.unanswered"),
      byPath(result, "result.unattempted"),
      byPath(result, "summary.unattempted")
    );

    // Time taken.

    const timeTakenSec = firstDefined(
      result.timeTakenSec,
      result.timeTaken,
      byPath(result, "data.timeTakenSec"),
      byPath(result, "result.timeTakenSec"),
      byPath(result, "summary.timeTakenSec")
    );

    // Violations.

    const violations = firstDefined(
      result.violationCount,
      result.violations,
      byPath(result, "data.violationCount"),
      byPath(result, "data.violations"),
      byPath(result, "result.violationCount"),
      byPath(result, "summary.violationCount")
    );

    // Display result values.

    setText(
      "score",
      score,
      "-"
    );

    setText(
      "correct",
      correct,
      "-"
    );

    setText(
      "wrong",
      wrong,
      "-"
    );

    setText(
      "unattempted",
      unattempted,
      "-"
    );

    setText(
      "timeTaken",
      formatTime(timeTakenSec),
      "-"
    );

    setText(
      "violations",
      violations,
      "0"
    );

    // Clear only the active tab's session and obsolete shared legacy keys.
    // Candidate-scoped results and all exam states are deliberately retained.

    function clearExamStorage() {
      sessionStorage.removeItem("neet_candidate");

      [
        "neet_candidate",
        "neet_submitted",
        "neet_result",
        "neet_pending_submission",
        "candidateId",
        "token",
        "candidateName",
        "candidatePhone",
        "candidateEmail"
      ].forEach(function(key) {
        localStorage.removeItem(key);
      });
    }

    // Logout.

    function backToLogin() {
      clearExamStorage();

      window.location.href =
        "login.html?v=" + Date.now();
    }

  </script>

</body>
</html>
