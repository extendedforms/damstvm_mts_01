
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#071a32"
  >

  <meta
    name="description"
    content="DAMS Trivandrum NEET PG Mock Test Series Candidate Result"
  >

  <title>Result - DAMS Trivandrum Mock Test Series</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body.result-page {
      min-height: 100vh;
      min-height: 100svh;
      padding: 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #f2f5f9;
      color: #26364d;

      font-family: Arial, sans-serif;
    }

    .result-container {
      width: min(1180px, 100%);
      margin: auto;
      padding: clamp(14px, 2.2vh, 24px);

      border: 1px solid #e1e7ef;
      border-radius: 20px;

      background: #ffffff;

      box-shadow:
        0 12px 38px rgba(15, 35, 60, .10);
    }

    .brand-heading {
      margin: 0 0 3px;

      color: #173f6c;
      text-align: center;

      font-size: clamp(17px, 2.3vw, 27px);
      line-height: 1.15;

      font-weight: 900;
      letter-spacing: .055em;
    }

    .result-heading {
      margin: 0 0 12px;

      color: #102b4c;
      text-align: center;

      font-size: clamp(25px, 3vw, 36px);
      line-height: 1.1;

      font-weight: 900;
    }

    /* Candidate details */

    .candidate-card {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));

      gap: 8px 14px;

      padding: 12px 14px;
      margin-bottom: 10px;

      border: 1px solid #e1e7ef;
      border-radius: 13px;

      background: #ffffff;
    }

    .candidate-line {
      min-width: 0;
      overflow-wrap: anywhere;

      font-size: clamp(12px, 1.2vw, 15px);
      line-height: 1.35;
    }

    .candidate-line strong {
      color: #34445b;
    }

    /* Result statistics */

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));

      gap: 9px;
    }

    .stat-card {
      min-width: 0;

      padding: 10px 13px;

      border: 1px solid #e1e7ef;
      border-radius: 13px;

      background: #ffffff;
    }

    .stat-label {
      color: #526176;

      font-size: 13px;
      font-weight: 750;
    }

    .stat-value {
      margin-top: 2px;

      color: #142f50;

      font-size: clamp(21px, 2.6vw, 31px);
      line-height: 1.1;

      font-weight: 900;
      overflow-wrap: anywhere;
    }

    /* Buttons */

    .result-actions {
      display: flex;

      justify-content: center;
      align-items: center;

      flex-wrap: wrap;
      gap: 10px;

      margin-top: 12px;
    }

    .result-btn {
      min-width: 145px;
      min-height: 42px;

      padding: 9px 18px;

      border: 0;
      border-radius: 10px;

      font-weight: 800;
      font-size: 14px;

      cursor: pointer;

      transition:
        opacity .2s ease,
        transform .2s ease;
    }

    .result-btn:hover {
      opacity: .9;
      transform: translateY(-1px);
    }

    .result-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .result-btn.primary {
      color: #ffffff;
      background: #173f6c;
    }

    .result-btn.secondary {
      color: #173f6c;
      background: #eaf0f6;
    }

    /* Status message */

    .result-note {
      min-height: 17px;
      margin-top: 7px;

      text-align: center;

      color: #66758a;
      font-size: 12px;

      overflow-wrap: anywhere;
    }

    .result-note.error {
      color: #a12d2d;
    }

    /* Mobile layout */

    @media (max-width: 700px) {

      body.result-page {
        padding: 8px;
        align-items: flex-start;
      }

      .result-container {
        padding: 13px;
        border-radius: 15px;
      }

      .candidate-card {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .stats-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 7px;
      }

      .stat-card {
        padding: 9px 10px;
      }

      .stat-label {
        font-size: 12px;
      }

      .result-btn {
        min-width: 125px;
      }
    }

    /* Short-height desktop screens */

    @media (max-height: 650px) and (min-width: 701px) {

      body.result-page {
        padding: 6px;
      }

      .result-container {
        padding: 10px 14px;
      }

      .candidate-card {
        padding: 8px 12px;
        margin-bottom: 7px;
      }

      .stats-grid {
        gap: 6px;
      }

      .stat-card {
        padding: 7px 11px;
      }

      .result-actions {
        margin-top: 7px;
      }

      .result-btn {
        min-height: 36px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }

  </style>

</head>

<body class="result-page">

  <main class="result-container">

    <!-- Institution heading -->

    <h1 class="brand-heading">
      DAMS TRIVANDRUM MOCK TEST SERIES
    </h1>

    <h2 class="result-heading">
      Result
    </h2>


    <!-- Candidate details -->

    <section
      class="candidate-card"
      aria-label="Candidate details"
    >

      <div class="candidate-line">
        <strong>Name:</strong>
        <span id="candName">-</span>
      </div>

      <div class="candidate-line">
        <strong>Candidate ID:</strong>
        <span id="candId">-</span>
      </div>

      <div class="candidate-line">
        <strong>Email:</strong>
        <span id="candEmail">-</span>
      </div>

      <div class="candidate-line">
        <strong>Phone:</strong>
        <span id="candPhone">-</span>
      </div>

    </section>


    <!-- Examination statistics -->

    <section
      class="stats-grid"
      aria-label="Examination result"
    >

      <div class="stat-card">

        <div class="stat-label">
          Score
        </div>

        <div
          class="stat-value"
          id="score"
        >
          -
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-label">
          Correct
        </div>

        <div
          class="stat-value"
          id="correct"
        >
          -
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-label">
          Wrong
        </div>

        <div
          class="stat-value"
          id="wrong"
        >
          -
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-label">
          Unattempted
        </div>

        <div
          class="stat-value"
          id="unattempted"
        >
          -
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-label">
          Time Taken
        </div>

        <div
          class="stat-value"
          id="timeTaken"
        >
          -
        </div>

      </div>


      <div class="stat-card">

        <div class="stat-label">
          Violations
        </div>

        <div
          class="stat-value"
          id="violations"
        >
          0
        </div>

      </div>

    </section>


    <!-- Result actions -->

    <div class="result-actions">

      <button
        class="result-btn primary"
        type="button"
        onclick="backToLogin()"
      >
        Logout
      </button>


      <button
        class="result-btn secondary"
        type="button"
        onclick="backToLogin()"
      >
        Back to Login
      </button>

    </div>


    <!-- Server response status -->

    <div
      class="result-note"
      id="statusNote"
      role="status"
      aria-live="polite"
    >
      Loading result…
    </div>

  </main>


  <!-- Load configuration first -->

  <script src="config.js?v=20261112_qr_b"></script>


  <!-- Load candidate-scoped result controller -->

  <script src="result.js?v=20261112_qr_b"></script>


</body>

</html>
