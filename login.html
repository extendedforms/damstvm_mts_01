
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071a32">

<title>DAMS TRIVANDRUM NEET PG MOCK TEST SERIES - Login</title>

<style>
:root {
  --login-navy: #0a2342;
  --login-blue: #174a7c;
  --login-gold: #d9ad62;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
}

body {
  min-height: 100vh;
  min-height: 100svh;
  margin: 0;
  padding: 30px 6%;

  display: flex;
  align-items: center;
  justify-content: flex-end;

  position: relative;

  background-color: #10243d;

  background-image:
    linear-gradient(
      115deg,
      rgba(5,18,35,.48),
      rgba(7,25,47,.25),
      rgba(6,18,34,.40)
    ),
    url("IMG_4116.jpeg");

  background-position: center center;
  background-size: cover;
  background-repeat: no-repeat;
  background-attachment: fixed;

  font-family: Arial, sans-serif;
}

/* LARGE BACKGROUND TITLE */

.hero-title {
  position: absolute;
  z-index: 1;

  left: 5%;
  top: 50%;
  transform: translateY(-50%);

  width: 65%;
  max-width: 1050px;

  color: #ff3b1f;

  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(38px, 7vw, 112px);
  font-weight: 700;
  line-height: 1.12;

  text-transform: uppercase;
  text-align: left;

  pointer-events: none;
  user-select: none;
}

/* LOGIN CARD */

.login-container {
  position: relative;
  z-index: 2;

  width: min(520px, 100%);
  margin: 0 0 0 auto;

  padding: 36px clamp(22px, 4vw, 42px);

  border: 1px solid rgba(255,255,255,.85);
  border-radius: 25px;

  background: rgba(255,255,255,.98);

  box-shadow: 0 26px 75px rgba(0,0,0,.32);

  text-align: left;
}

/* LOGO */

.logo {
  display: block;

  width: min(100%, 310px);
  height: auto;
  max-height: 86px;

  object-fit: contain;
  object-position: center;

  margin: 0 auto 20px;
}

/* CANDIDATE PORTAL LABEL */

.login-container:before {
  content: "CANDIDATE PORTAL";

  display: block;
  width: max-content;

  margin-bottom: 15px;
  padding: 7px 11px;

  border-left: 3px solid var(--login-gold);
  border-radius: 3px;

  background: #f2f5f9;
  color: var(--login-blue);

  font-size: 10px;
  font-weight: 900;
  letter-spacing: .16em;
}

/* INSTITUTE NAME */

.inst-name {
  margin: 0;

  color: var(--login-navy);

  font-size: clamp(23px, 3vw, 30px);
  font-weight: 900;
  text-align: center;
}

/* LOGIN SUBTITLE */

.title {
  margin: 10px 0 25px;

  color: #667085;
  font-size: 14px;
  text-align: center;
}

/* LOGIN FORM */

.form {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 13px;
}

.form > input,
.password-box input {
  width: 100%;
  min-width: 0;
  height: 49px;

  border: 1px solid #d5dce6;
  border-radius: 10px;

  padding: 0 13px;

  background: #fff;
  color: #172235;

  font: inherit;
  font-size: 14px;
}

.form > input:focus,
.password-box input:focus {
  outline: none;
  border-color: var(--login-blue);
  box-shadow: 0 0 0 3px rgba(23,74,124,.12);
}

/* PASSWORD FIELD */

.password-box {
  position: relative;
  grid-column: 1/-1;
}

.password-box input {
  padding-right: 50px;
}

.toggle {
  position: absolute;
  top: 50%;
  right: 13px;
  transform: translateY(-50%);

  width: 34px;
  height: 34px;

  border: 0;
  background: transparent;
  color: #52657c;

  cursor: pointer;
}

/* LOGIN BUTTON */

.form > button {
  grid-column: 1/-1;

  width: 100%;
  min-height: 55px;
  margin-top: 4px;

  border: 0;
  border-radius: 10px;

  background: linear-gradient(100deg,#0b2b50,#1a5285);

  color: #fff;
  font-size: 15px;
  font-weight: 850;

  cursor: pointer;
  transition: opacity .2s, transform .2s;
}

.form > button:hover {
  transform: translateY(-1px);
}

.form > button:disabled {
  opacity: .55;
  cursor: wait;
}

/* STATUS MESSAGE */

#msg {
  grid-column: 1/-1;

  min-height: 20px;
  margin: 0;

  text-align: center;
  font-size: 13px;
  overflow-wrap: anywhere;
}

/* FOOTER */

.login-container:after {
  content: "Powered by ZENITH HIGH";

  display: block;

  margin-top: 22px;
  padding-top: 18px;

  border-top: 1px solid #e8edf3;

  color: #7b8796;
  text-align: center;

  font-size: 11px;
  font-weight: 700;
}

/* TABLETS */

@media (max-width: 900px) {

  body {
    justify-content: center;
    padding: 25px 18px;

    background-attachment: scroll;
    background-position: center center;
  }

  .hero-title {
    display: none;
  }

  .login-container {
    width: min(520px, 100%);
    margin: auto;
  }
}

/* MOBILE PHONES */

@media (max-width: 600px) {

  body {
    padding: 18px 13px;

    background-position: center center;
  }

  .login-container {
    padding: 25px 19px 21px;
  }

  .logo {
    width: min(100%,270px);
    max-height: 72px;
  }

  .form {
    grid-template-columns: 1fr;
    gap: 11px;
  }

  .password-box,
  .form > button,
  #msg {
    grid-column: 1;
  }

  .form > input,
  .password-box input {
    height: 48px;
    font-size: 16px;
  }
}
</style>
</head>

<body>

<!-- LARGE TITLE ON BACKGROUND -->

<div class="hero-title">
  DAMS TRIVANDRUM<br>
  MOCK TEST SERIES
</div>

<!-- LOGIN CARD -->

<main class="login-container">

  <img
    src="IMG_4060.jpeg"
    class="logo"
    alt="DAMS Trivandrum Logo"
  >

  <h2 class="inst-name">
    DAMS TRIVANDRUM
  </h2>

  <h3 class="title">
    NEET PG MOCK TEST SERIES Login
  </h3>

  <div class="form">

    <input
      type="text"
      id="fullName"
      placeholder="Full Name"
      autocomplete="name"
      aria-label="Full Name"
    >

    <input
      type="tel"
      id="phone"
      placeholder="Phone Number"
      autocomplete="tel"
      aria-label="Phone Number"
    >

    <input
      type="email"
      id="email"
      placeholder="Email"
      autocomplete="email"
      aria-label="Email"
    >

    <input
      type="text"
      id="cid"
      placeholder="Candidate ID"
      autocomplete="username"
      aria-label="Candidate ID"
    >

    <div class="password-box">

      <input
        type="password"
        id="pwd"
        placeholder="Password"
        autocomplete="current-password"
        aria-label="Password"
      >

      <button
        class="toggle"
        type="button"
        onclick="togglePassword()"
        aria-label="Show or hide password"
      >◉</button>

    </div>

    <button
      type="button"
      onclick="login()"
    >
      LOGIN
    </button>

    <p
      id="msg"
      role="status"
      aria-live="polite"
    ></p>

  </div>

</main>

<!-- EXISTING CONFIGURATION AND LOGIN SCRIPT -->

<script src="config.js?v=20261112_qr_a"></script>
<script src="login.js?v=20261112_qr_a"></script>

</body>
</html>
